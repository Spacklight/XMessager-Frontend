<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Groups — XMessager</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="logo"><img src="" id="logoImg" alt=""> Groups</div>
    </div>
  </header>
  <main>
    <div class="card">
      <h3>Create a group</h3>
      <div class="field" style="margin-top:10px"><input type="text" id="gName" placeholder="Group name"></div>
      <div class="field"><input type="text" id="gDesc" placeholder="What's this group about?"></div>
      <div class="field">
        <select id="gVisibility">
          <option value="public">Public — anyone can join</option>
          <option value="private">Private — invite only</option>
        </select>
      </div>
      <button class="btn" id="createBtn">Create group</button>
      <p class="error-msg" id="createErr"></p>
    </div>
    <div class="section-label">Discover public groups</div>
    <div id="list"><div class="empty">Loading...</div></div>
  </main>
  <div id="navSlot"></div>
</div>
<script src="js/api.js"></script>
<script src="js/groups.js"></script>
</body></html>
