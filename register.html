<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account — XMessager</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <div class="auth-wrap">
    <div class="auth-logo">
      <img src="" id="logoImg" alt="XMessager">
      <h1>Create your account</h1>
    </div>
    <form id="registerForm">
      <div class="field">
        <label>Display name</label>
        <input type="text" id="displayName" required placeholder="Your name" autocomplete="name">
      </div>
      <div class="field">
        <label>Email address</label>
        <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required minlength="8" placeholder="At least 8 characters" autocomplete="new-password">
      </div>
      <button class="btn" type="submit" id="submitBtn">Create account</button>
      <p class="error-msg" id="err"></p>
    </form>
    <p class="switch-link">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/register.js"></script>
</body></html>
