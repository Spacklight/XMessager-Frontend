<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market — XMessager</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="logo"><img src="" id="logoImg" alt=""> XMessager</div>
      <div style="display:flex;align-items:center;gap:16px">
        <a href="market-stats.html" class="stats-link">📊</a>
        <a href="notifications.html" class="notif-bell">🔔<span id="notifBadge" class="notif-badge">0</span></a>
        <a href="settings.html"><div class="avatar" id="myAvatar">?</div></a>
      </div>
    </div>
    <div class="tabs">
      <a href="home.html">Home</a>
      <a href="market.html" class="active">Market</a>
    </div>
  </header>
  <div class="reel-wrap" id="reelWrap">
    <div class="empty" style="color:#fff">Loading videos...</div>
  </div>
  <a href="market-upload.html" class="glass-fab">+</a>
  <div id="navSlot"></div>

  <div class="sheet-overlay hidden" id="videoCommentsOverlay">
    <div class="sheet">
      <div class="handle"></div>
      <div class="comments-panel-video">
        <div class="comment-list" id="videoCommentList"></div>
        <div class="comment-input-row" style="padding:0 14px 10px">
          <input type="text" id="videoCommentInput" placeholder="Add a comment...">
          <button class="icon-btn" style="width:34px;height:34px" id="videoCommentSend">➤</button>
        </div>
      </div>
    </div>
  </div>

  <div class="page-loader" id="pageLoader">
    <div class="loader-spinner"></div>
    <div class="loader-text">Loading...</div>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/market.js"></script>
</body></html>
