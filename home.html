<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XMessager</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="logo"><img src="" id="logoImg" alt=""> XMessager</div>
      <div style="display:flex;align-items:center;gap:16px">
        <a href="notifications.html" class="notif-bell">🔔<span id="notifBadge" class="notif-badge">0</span></a>
        <a href="settings.html"><div class="avatar" id="myAvatar">?</div></a>
      </div>
    </div>
    <div class="tabs">
      <a href="home.html" class="active">Home</a>
      <a href="market.html">Market</a>
    </div>
  </header>

  <main id="content">
    <div class="empty">Loading...</div>
  </main>

  <button class="fab" id="fabBtn" style="border:2px solid var(--accent);background:var(--white)">+</button>
  <div id="navSlot"></div>

  <div class="sheet-overlay hidden" id="sheetOverlay">
    <div class="sheet">
      <div class="handle"></div>
      <a class="sheet-option" href="new-chat.html">
        <div class="ico"><svg viewBox="0 0 40 32" width="26" height="22" fill="currentColor"><circle cx="14" cy="8" r="7"/><path d="M2 30c0-7 5-11 12-11s12 4 12 11z"/><rect x="28" y="6" width="3" height="14" rx="1"/><rect x="22" y="12" width="15" height="3" rx="1"/></svg></div>
        <div class="txt"><strong>New chat</strong><span>Message a friend by their email</span></div>
      </a>
      <a class="sheet-option" href="groups.html">
        <div class="ico"><svg viewBox="0 0 46 32" width="30" height="22" fill="currentColor"><circle cx="10" cy="8" r="6.5" opacity=".5"/><path d="M0 29c0-6.2 4.4-9.8 10-9.8 2 0 3.8.5 5.2 1.3-2 1.9-3.2 4.6-3.2 8.5H0z" opacity=".5"/><circle cx="17" cy="8" r="6.5"/><path d="M6 29c0-6.5 4.9-10.2 11-10.2s11 3.7 11 10.2H6z"/><rect x="34" y="6" width="3" height="14" rx="1"/><rect x="28" y="12" width="15" height="3" rx="1"/></svg></div>
        <div class="txt"><strong>Create or join a group</strong><span>Find public groups or start your own</span></div>
      </a>
      <a class="sheet-option" href="pages.html">
        <div class="ico">🚩</div>
        <div class="txt"><strong>Create or join a page</strong><span>Follow public pages or start your own</span></div>
      </a>
    </div>
  </div>

  <div class="page-loader" id="pageLoader">
    <div class="loader-spinner"></div>
    <div class="loader-text">Loading...</div>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/home.js"></script>
</body></html>
