<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in — XMessager</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <div class="auth-wrap">
    <div class="auth-logo">
      <img src="" id="logoImg" alt="XMessager">
      <h1>XMessager</h1>
    </div>
    <form id="loginForm">
      <div class="field">
        <label>Email address</label>
        <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required placeholder="Your password" autocomplete="current-password">
      </div>
      <button class="btn" type="submit" id="submitBtn">Log in</button>
      <p class="error-msg" id="err"></p>
    </form>
    <p class="switch-link">Don't have an account? <a href="register.html">Create one</a></p>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body></html>
